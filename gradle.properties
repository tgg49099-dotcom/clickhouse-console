# Build metadata.
#
# The public name of the plugin and its price are decided by the repository
# owner. The identifier (`id`) becomes DEFINITIVE once the plugin is published
# on the Marketplace: it must not change afterwards.

pluginGroupId = com.tgglabs.clickhouseconsole
pluginName = ClickHouse Console

# Version LIVRABLE (le nom du ZIP : ClickHouseConsole-0.0.1.zip).
# V0 : rien n'est publie, aucun prix n'est pose. Cette numerotation n'est
# pas une version Marketplace (voir pluginMarketplaceVersion).
pluginVersion = 0.0.1

# Version du PLUGIN telle qu'elle est ecrite dans le <version> de plugin.xml.
# Aucune vente n'est en ligne : le numero de livraison (0.0.1) sert donc de
# version de plugin. Le jour ou la vente existe, ce champ devra porter le
# `release-version` du descripteur de produit (2026.1.0 <-> 20261).
pluginMarketplaceVersion = 0.0.1

# Compatibility: `since-build` = 253 = IntelliJ Platform 2025.3.
# Le plugin ne depend que de `com.intellij.modules.platform` : il tourne
# donc dans IDEA Community, PyCharm Community, WebStorm, etc. - precisement
# les IDE ou la boite a outils "Database Tools" n'existe pas.
pluginSinceBuild = 253

# `until-build`: absent on purpose. Le plugin ne depend que de
# `com.intellij.modules.platform`, dont l'API publique n'a pas bouge depuis
# 2025.3 : une borne haute serait une restriction sans raison mesurable.

# Compilation IDE: IntelliJ IDEA Community 2025.3.
platformVersion = 2025.3
platformType = IC

pluginVendorName = Tgg Labs
pluginVendorEmail = tgg.apps.support@gmail.com
pluginVendorUrl = https://plugins.jetbrains.com/vendor/tgg-labs

# Le daemon Gradle est limite a 900 MB : le conteneur a un plafond cgroup de
# 2 Go et le daemon Kotlin partage la meme enveloppe.
org.gradle.jvmargs = -Xmx900m -Dfile.encoding=UTF-8
org.gradle.parallel = false
org.gradle.caching = true

# Compilation Kotlin DANS le daemon Gradle : un daemon Kotlin separé
# depasserait le plafond memoire du conteneur.
kotlin.compiler.execution.strategy = in-process
kotlin.code.style = official
